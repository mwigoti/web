<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" width="32" height="32">
  <!-- Background circular disk for high-contrast visibility on both dark and light browser tabs -->
  <circle cx="0" cy="0" r="96" fill="#11201D" stroke="#2B4543" stroke-width="4" />
  <!-- Six-blade pinwheel/asterisk emblem in signature TerraSat Lime (#CFF4A7) -->
  <g fill="#CFF4A7">
    <polygon points="0,0 0,-78 26,-78 26,-15" transform="rotate(0)" />
    <polygon points="0,0 0,-78 26,-78 26,-15" transform="rotate(60)" />
    <polygon points="0,0 0,-78 26,-78 26,-15" transform="rotate(120)" />
    <polygon points="0,0 0,-78 26,-78 26,-15" transform="rotate(180)" />
    <polygon points="0,0 0,-78 26,-78 26,-15" transform="rotate(240)" />
    <polygon points="0,0 0,-78 26,-78 26,-15" transform="rotate(300)" />
  </g>
  <!-- Center focal eye in TerraSat forest tone -->
  <circle cx="0" cy="0" r="10" fill="#11201D" />
</svg>
