<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="100%" height="100%" fill="none">
  <!-- Left Geometric Monogram (EF) -->
  <g transform="translate(30, 24)">
    <!-- Top Navy Bar & Upper Vertical Hook -->
    <path d="M0,0 L56,0 L56,22 L14,22 L14,34 L0,34 Z" fill="#1E2A58" />
    
    <!-- Central Red Bar (#E11D48) -->
    <rect x="14" y="34" width="32" height="14" fill="#E11D48" />
    
    <!-- Lower Navy L-Hook -->
    <path d="M0,34 L14,34 L14,76 L0,76 Z" fill="#1E2A58" />
    
    <!-- Bottom Right Navy Square Dot -->
    <rect x="24" y="52" width="32" height="24" fill="#1E2A58" />
  </g>

  <!-- Right Typography -->
  <g transform="translate(108, 48)">
    <!-- "EXPERTISE" -->
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#1E2A58" letter-spacing="1.2">EXPERTISE</text>
    
    <!-- "FRANCE" -->
    <text x="0" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#1E2A58" letter-spacing="1.2">FRANCE</text>
    
    <!-- "GROUPE AFD" -->
    <text x="0" y="47" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#1E2A58" letter-spacing="2">GROUPE AFD</text>
  </g>
</svg>
